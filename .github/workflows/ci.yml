name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values so the SPA can be built without real credentials.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  db-tests:
    name: Database tests (pgTAP) and types drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` devDependency in package.json.
          version: 2.122.0

      - name: Start local Supabase stack
        # A fresh start applies supabase/migrations and supabase/seed.sql and serves the Edge
        # Functions at http://127.0.0.1:54321/functions/v1/<name> through the edge runtime.
        run: supabase start

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # The Supabase edge runtime is Deno 2.
          deno-version: v2.x

      - name: Typecheck Edge Functions
        # Deno is not part of the local toolchain (functions run in the Docker edge runtime), so
        # this is the only place the functions are type-checked.
        # DENO_NO_PACKAGE_JSON: see the tokenizer step below.
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Search tokenizer fixture under Deno
        # tests/fixtures/search-tokenizer.json through supabase/functions/_shared/search.ts in the
        # Deno runtime; the verify job checks the same fixture for the frontend under Vitest.
        # DENO_NO_PACKAGE_JSON: this job has no node_modules, so Deno must not treat the repo's
        # package.json as an npm project (it would look for @types/node there).
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno test --no-lock --allow-read tests/parity/search-tokenizer.deno.ts

      - name: Edge Function smoke test
        # Status codes only: no credentials -> 401, non-member invite -> 403, unknown token -> 404.
        run: bash scripts/ci/functions-smoke.sh

      - name: Purge drain check
        # purge-attachments regression (review finding H2): one call drains 300 long-named queue
        # entries and answers { purged, alreadyGone, retryable, dead }. Reads the service-role
        # key from `supabase status -o env` without printing it.
        run: bash scripts/ci/purge-drain-check.sh

      - name: Run pgTAP tests
        run: supabase test db

      - name: Set up Node
        # Node 24 runs the TypeScript concurrency test directly (type stripping); no npm install.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Concurrency tests
        # Two real database sessions per case through the host psql client (ubuntu-latest ships
        # one): attachment cap, field delete, option removal and update_record races.
        run: npm run test:concurrency

      - name: Check generated types for drift
        run: |
          supabase gen types typescript --local > /tmp/supabase.ts
          if ! diff -u src/types/supabase.ts /tmp/supabase.ts; then
            echo "::error file=src/types/supabase.ts::Generated types are out of date. Run 'npm run db:types' and commit the result."
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: End-to-end tests (Playwright)
    # Pull requests into main and pushes to main only; the workflow itself runs on every push.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` devDependency in package.json.
          version: 2.122.0

      - name: Start local Supabase stack
        # Applies supabase/migrations and supabase/seed.sql; the edge runtime serves the functions.
        run: supabase start

      - name: Write .env.local for the dev server
        # Only the API URL and the anon key, read without echoing. The service-role key is never
        # written anywhere (the global teardown reads it in memory for purge-attachments).
        run: |
          STATUS_ENV=$(supabase status -o env 2>/dev/null)
          API_URL=$(printf '%s\n' "$STATUS_ENV" | sed -nE 's/^API_URL="?([^"]*)"?$/\1/p' | head -n 1)
          ANON_KEY=$(printf '%s\n' "$STATUS_ENV" | sed -nE 's/^ANON_KEY="?([^"]*)"?$/\1/p' | head -n 1)
          unset STATUS_ENV
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::API_URL or ANON_KEY missing from 'supabase status -o env'"
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.local

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium and system dependencies
        # System packages are not cached, so this runs on a cache hit too (browser download skipped).
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # tests/e2e/global-setup.ts checks the stack and probes the Edge Functions (401 without
        # credentials); if the edge runtime does not answer it starts `supabase functions serve`
        # itself and stops it in teardown, the same logic as scripts/ci/functions-smoke.sh.
        # The teardown fails the job if the seed changed.
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
