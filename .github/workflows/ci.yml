name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values so the SPA can be built without real credentials.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  db-tests:
    name: Database tests (pgTAP) and types drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` devDependency in package.json.
          version: 2.122.0

      - name: Start local Supabase stack
        # A fresh start applies supabase/migrations and supabase/seed.sql and serves the Edge
        # Functions at http://127.0.0.1:54321/functions/v1/<name> through the edge runtime.
        run: supabase start

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # The Supabase edge runtime is Deno 2.
          deno-version: v2.x

      - name: Typecheck Edge Functions
        # Deno is not part of the local toolchain (functions run in the Docker edge runtime), so
        # this is the only place the functions are type-checked.
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Edge Function smoke test
        # Status codes only: no credentials -> 401, non-member invite -> 403, unknown token -> 404.
        run: bash scripts/ci/functions-smoke.sh

      - name: Run pgTAP tests
        run: supabase test db

      - name: Check generated types for drift
        run: |
          supabase gen types typescript --local > /tmp/supabase.ts
          if ! diff -u src/types/supabase.ts /tmp/supabase.ts; then
            echo "::error file=src/types/supabase.ts::Generated types are out of date. Run 'npm run db:types' and commit the result."
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
